notes:
  - Approximate fixed transforms are allowed by Lab2/PROJECT_REQUIREMENTS_AI.md line 72.
  - Precision calibration is not required before initial implementation.
  - Test assumptions are not measured mounting orientation.
  - The earlier dependency-only test used temporary yaw=0; the later front-bin check supports yaw=+90 degrees.
  - Use the drawing's 0.690 by 0.570 m envelope as the lab collision geometry, per user instruction.
  - The 0.050 m padding is applied once by Nav2; physical polygon vertices remain unpadded.
  - The 0.335 m height describes the chassis, not the complete sensor-equipped robot or obstacle-height cutoff.
  - The 0.125 m forward offset uses the accepted nominal 0.690 m length and centre origin.
  - The 0.220 m measurement is relative to the foremost track edge line, not the body shell.
  - The camera internal optical transforms are provided by its driver.
  - Camera housing centre is distinct from camera_link; the driver origin offset is included separately.
  - Camera pitch was estimated from a floor ROI; yaw/roll and housing measurement point remain approximate.
