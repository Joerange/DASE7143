mission_node:
  ros__parameters:
    motion_enabled: false
    autostart: false
    target_label: trash can
    lock_target_on_navigation: true
    visual_target_refinement: true
    target_update_interval: 1.0
    docking_target_gap: 0.10
    docking_goal_margin: 0.0
    docking_min_gap: 0.06
    docking_gap_tolerance: 0.02
    docking_position_tolerance: 0.02
    docking_yaw_tolerance: 0.10
    docking_terminal_zone: 0.45
    docking_terminal_speed: 0.10
    navigation_speed_scale: 1.5
    navigation_max_linear: 0.25
    mission_timeout: 300.0
    # Jetson low-speed profile: tolerate scheduling jitter without accepting
    # disconnected sensors, stale replayed stamps, or invalid geometry.
    status_timeout: 0.8
    odom_timeout: 0.6
    # map->base timestamp can follow the last scan during a short scan gap;
    # independent guard still requires fresh odom->base and live TF receipts.
    tf_timeout: 2.8
    map_timeout: 10.0
    detector_timeout: 1.5
    target_timeout: 0.5
    init_timeout: 60.0
    recovery_timeout: 60.0
    plan_timeout: 5.0
    plan_validity: 10.0
    goal_timeout: 10.0
    feedback_timeout: 5.0
    cancel_timeout: 5.0
    lifecycle_timeout: 5.0
    lifecycle_request_timeout: 3.0
    log_dir: ~/.ros/robot_mission
command_guard_node:
  ros__parameters:
    localization_mode: slam
    motion_enabled: false
    # RGB-D is required to create the first goal, not to retain a motion lease.
    # Depth remains visible in the console; LiDAR stays required for navigation.
    require_depth: false
    locked_target_navigation: true
    allow_target_refinement: true
    min_gap: 0.06
    docking_stop_gap: 0.08
    max_linear: 0.25
    max_angular: 0.30
    # Operator checks surrounding space before starting in-place search.
    # Operator confirmed clear route: Nav2 owns navigation obstacle avoidance.
    search_sweep_enabled: false
    navigation_sweep_enabled: false
    command_timeout: 0.3
    mission_timeout: 1.5
    # Operator-approved jitter budget; actual capture stamps remain mandatory.
    scan_timeout: 2.5
    depth_timeout: 0.6
    odom_timeout: 0.6
    tf_timeout: 0.6
    map_tf_timeout: 2.8
    map_timeout: 10.0
    slam_pose_timeout: 3.5
    target_timeout: 0.5
    control_heartbeat_timeout: 1.0
    chassis_health_timeout: 1.0
    # Guard adds actual scan acquisition age + command delay when larger.
    reaction_time: 1.3
    localization_timeout: 30.0
